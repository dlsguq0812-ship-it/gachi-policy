<body>
  <header>

  <main>

  <dialog id="toc"><div class="toc-header"><h2>목차</h2><button class="control" id="tocClose" aria-label="목차 닫기" type="button">닫기</button></div><ul id="tocList"></ul></dialog>
  <script type="module">
    const $ = (id) => document.getElementById(id);
    const TOC = [{"title":"표지","page":1},{"title":"정책 목록","page":3},{"title":"소통","section":true},{"title":"경상대학 APP 구축 및 운영","page":6},{"title":"정책 학우투표제","page":11},{"title":"학생회실 개방","page":19},{"title":"경상대학 동아리 개설 지원","page":23},{"title":"유학생 제주생활정보 지원","page":26},{"title":"정책 이행 현황 상시 공개","page":30},{"title":"교육·취업","section":true},{"title":"경상 학술제","page":37},{"title":"Haevichi 기업탐방 & 채용 연계 면접 프로그램","page":44},{"title":"실무 역량 특강 프로그램","page":50},{"title":"전공별 진로 로드맵과 졸업생 아카이브","page":54},{"title":"시험기간 스터디 챌린지","page":60},{"title":"시설","section":true},{"title":"휴게실 설치","page":67},{"title":"화장실 안심 프로젝트","page":72},{"title":"텀블러 세척기 설치","page":78},{"title":"1호관 3층 홀 개선","page":82},{"title":"스터디카페 이용 환경 개선","page":86},{"title":"시설물 정기점검","page":90},{"title":"문화","section":true},{"title":"단과대 교류전 진행","page":95},{"title":"가치 갤러리(1호관 복도 전시)","page":99},{"title":"4.3 및 지역사회 콘텐츠 기획","page":106},{"title":"인권·복지","section":true},{"title":"가치 짐 보관&박스 공동구매","page":113},{"title":"자원순환보증금 반환기 설치","page":120},{"title":"가치X클린올레","page":125},{"title":"학생사회 연속성","section":true},{"title":"학생회 인수인계 체계화","page":132}];
    const PDF_URL = new URL('./value-policy.pdf?v=d8d8ebc52849', location.href).href;
    const VERSION = '6.4.299';
    const CDNS = [`https://cdn.jsdelivr.net/npm/pdfjs-dist@${VERSION}/`, `https://unpkg.com/pdfjs-dist@${VERSION}/`];
    let pdf, pdfjs, renderTask, serial = 0, currentPage = 1, zoom = 1, rendering = false, resizeTimer;
    const canvas = $('canvas'), reader = $('reader');
    const initial = Number(new URLSearchParams(location.hash.slice(1)).get('page'));
    function updateControls() {
      $('previous').disabled = !pdf || currentPage <= 1;
      $('next').disabled = !pdf || currentPage >= pdf.numPages;
      $('pageNumber').disabled = !pdf;
      $('zoomIn').disabled = !pdf || zoom >= 3;
      $('zoomOut').disabled = !pdf || zoom <= 1;
      $('fit').disabled = !pdf;
      $('pageNumber').value = currentPage;
      $('zoomLabel').textContent = `${Math.round(zoom * 100)}%`;
    }
    function setBusy(busy) { $('busy').hidden = !busy; rendering = busy; }
    function showError(message) {
      $('errorMessage').textContent = message;
      $('error').hidden = false; $('status').textContent = '문서 열기를 다시 시도해 주세요.';
      setBusy(false);
    }
    async function showPage(number, resetScroll = true) {
      if (!pdf) return;
      const target = Math.max(1, Math.min(pdf.numPages, Math.floor(Number(number) || 1)));
      const ticket = ++serial;
      currentPage = target; updateControls(); setBusy(true); $('error').hidden = true;
      $('status').textContent = `${target}페이지를 불러오는 중입니다.`;
      try {
        const prior = renderTask;
        if (prior) { prior.cancel(); try { await prior.promise; } catch (_) {} }
        if (ticket !== serial) return;
        const page = await pdf.getPage(target);
        if (ticket !== serial) return;
        const base = page.getViewport({scale:1});
        const fitWidth = Math.min(reader.clientWidth - 6, 960);
        const viewport = page.getViewport({scale:Math.max(240,fitWidth) / base.width * zoom});
        const pixelRatio = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.floor(viewport.width * pixelRatio);
        canvas.height = Math.floor(viewport.height * pixelRatio);
        canvas.style.width = `${viewport.width}px`; canvas.style.height = `${viewport.height}px`;
        canvas.setAttribute('aria-label', `세부기획안 ${target}페이지`);
        const task = page.render({canvasContext:canvas.getContext('2d'), viewport, transform:pixelRatio===1?null:[pixelRatio,0,0,pixelRatio,0,0]});
        renderTask = task;
        await task.promise;
        if (ticket !== serial) return;
        renderTask = null;
        if (resetScroll) { reader.scrollLeft = 0; reader.scrollTop = 0; }
        $('status').textContent = `${target} / ${pdf.numPages}페이지`;
        history.replaceState(null, '', `${location.pathname}${location.search}#page=${target}`);
        setBusy(false);
        const text = await page.getTextContent();
        if (ticket === serial) $('pageText').textContent = text.items.map(item => item.str + (item.hasEOL?'\n':' ')).join('');
      } catch (error) {
        if (ticket !== serial || error.name === 'RenderingCancelledException') return;
        console.error('문서 표시 실패', error);
        showError('인터넷 연결을 확인한 후 다시 열어주세요. 카카오톡 등 앱 안에서 열리지 않으면 Safari 또는 Chrome에서 이 주소를 열어주세요.');
      }
    }
    async function openDocument() {
      setBusy(true); $('error').hidden = true;
      try {
        if (!pdfjs) {
          let lastError;
          for (const base of CDNS) {
            try {
              pdfjs = await import(base + 'legacy/build/pdf.min.mjs');
              pdfjs.GlobalWorkerOptions.workerSrc = base + 'legacy/build/pdf.worker.min.mjs';
              pdf = await pdfjs.getDocument({url:PDF_URL, cMapUrl:base+'cmaps/', cMapPacked:true, standardFontDataUrl:base+'standard_fonts/', wasmUrl:base+'wasm/', disableAutoFetch:true, disableStream:true}).promise;
              break;
            } catch(error) { lastError = error; pdfjs = null; }
          }
          if (!pdf) throw lastError;
        }
        $('totalPages').textContent = pdf.numPages; $('metaPages').textContent = pdf.numPages;
        $('pageNumber').max = pdf.numPages;
        await showPage(initial > 0 ? initial : currentPage);
      } catch(error) {
        console.error('문서 로딩 실패',error);
        showError('인터넷 연결을 확인한 후 다시 시도해 주세요. 계속 열리지 않으면 Safari 또는 Chrome에서 이 주소를 열어주세요. PDF 다운로드는 위 버튼에서 선택할 수 있습니다.');
      }
    }
    $('previous').addEventListener('click',()=>showPage(currentPage-1));
    $('next').addEventListener('click',()=>showPage(currentPage+1));
    $('pageNumber').addEventListener('change',e=>showPage(e.target.value));
    $('pageNumber').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();showPage(e.target.value);e.target.blur();}});
    $('zoomIn').addEventListener('click',()=>{zoom=Math.min(3,zoom+.25);showPage(currentPage,false);});
    $('zoomOut').addEventListener('click',()=>{zoom=Math.max(1,zoom-.25);showPage(currentPage,false);});
    $('fit').addEventListener('click',()=>{zoom=1;showPage(currentPage);});
    $('retry').addEventListener('click',()=>pdf?showPage(currentPage):openDocument());
    $('tocOpen').addEventListener('click',()=>{if(typeof $('toc').showModal==='function')$('toc').showModal();else $('toc').setAttribute('open','');});
    $('tocClose').addEventListener('click',()=>$('toc').close());
    $('toc').addEventListener('click',e=>{if(e.target===$('toc')){$('toc').close();}});
    for (const item of TOC) {
      const li = document.createElement('li');
      if (item.section) { li.className='toc-section'; li.textContent=item.title; }
      else {
        const button=document.createElement('button'); button.className='toc-item';button.type='button';
        const title=document.createElement('span');title.textContent=item.title;
        const page=document.createElement('span');page.className='toc-page';page.textContent=`${item.page}쪽`;
        button.append(title,page);button.addEventListener('click',()=>{$('toc').close();showPage(item.page);});li.append(button);
      }
      $('tocList').append(li);
    }
    document.addEventListener('keydown',e=>{
      if(['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)||$('toc').open)return;
      if(e.key==='ArrowRight'){e.preventDefault();showPage(currentPage+1);}
      if(e.key==='ArrowLeft'){e.preventDefault();showPage(currentPage-1);}
    });
    addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>pdf&&showPage(currentPage,false),180);});
    openDocument();
  </script>
